services:
  db:
    image: postgres:17
    container_name: edfly-db
    environment:
      POSTGRES_USER: edfly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: edfly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edfly -d edfly"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: