<!doctype html>
<html lang="en">
<style>
  :root {
    --bs-body-bg: #F5F6F7;
    --bs-body-color: #171A21;
    --bs-border-color: #D9DDE3;
  }

  body {
    background-color: #F5F6F7;
    color: #171A21;
  }

  /* Surface / Card styling */
  .card {
    background-color: #FFFFFF;
    border: 1px solid #D9DDE3;
    border-radius: 0.75rem;
  }

  /* Primary Action Buttons */
  .btn-primary {
    background-color: #374151;
    border-color: #374151;
    color: #FFFFFF;
  }
  .btn-primary:hover, .btn-primary:focus {
    background-color: #171A21;
    border-color: #171A21;
  }

  /* Navbar styling matching the dark slate header */
  .navbar {
    background-color: #171A21 !important;
  }

  /* Borders & Secondary text colors */
  .border, .form-control, .form-select {
    border-color: #D9DDE3;
  }
  .form-control:focus, .form-select:focus {
    border-color: #374151;
    box-shadow: 0 0 0 0.25rem rgba(55, 65, 81, 0.15);
  }
  .text-muted, .text-secondary {
    color: #6B7280 !important;
  }
</style>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EDfly{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">
  <a class="visually-hidden-focusable" href="#main">Skip to main content</a>

  <nav class="navbar navbar-expand-md bg-primary" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">EDfly</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNav" aria-controls="mainNav"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'join_form' %}active{% endif %}"
               {% if request.endpoint == 'join_form' %}aria-current="page"{% endif %}
               href="{{ url_for('join_form') }}">Join the queue</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'staff_dashboard' %}active{% endif %}"
               {% if request.endpoint == 'staff_dashboard' %}aria-current="page"{% endif %}
               href="{{ url_for('staff_dashboard') }}">Staff</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main id="main" class="container my-4 flex-grow-1">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="border-top py-3 text-center text-body-secondary small">
    EDfly · CCC181
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
